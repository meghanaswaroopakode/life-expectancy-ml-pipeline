name: Lab 13 - API Integration Tests

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "tests/**"
      - "models/**"
      - "requirements.txt"
      - "Life Expectancy Data.csv"
      - ".github/workflows/lab13_ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "models/**"
      - "requirements.txt"
      - "Life Expectancy Data.csv"
      - ".github/workflows/lab13_ci.yml"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run Lab 13 API Integration Tests
        run: python -m pytest tests/test_lab13_integration.py -v
