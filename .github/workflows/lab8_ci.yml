name: Lab 8 - Life Expectancy MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pipelines/**"
      - "requirements.txt"
      - "Life Expectancy Data.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "pipelines/**"
      - "requirements.txt"
      - "Life Expectancy Data.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reset MLflow database for CI
        run: |
          rm -f artifacts/mlflow.db
          rm -rf mlruns

      - name: Run Life Expectancy MLOps Pipeline
        run: python pipelines/run_lab7_pipeline.py

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-expectancy-lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
          if-no-files-found: ignore
